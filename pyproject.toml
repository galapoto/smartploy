[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "smartploy"
version = "0.1.0"
description = "Standalone job intelligence and application orchestration powered by ObumAI"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "pydantic>=2.9,<3",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "ruff>=0.7,<1",
]

[project.scripts]
smartploy-api = "smartploy.api:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["smartploy*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"
