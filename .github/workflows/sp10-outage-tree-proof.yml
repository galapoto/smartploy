name: SP-10 OIDC outage exact-source provenance (CI only)

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  SP10_NO_DEPLOY: "true"

jobs:
  exact-candidate-application:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: smartploy
          POSTGRES_PASSWORD: smartploy
          POSTGRES_DB: smartploy_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U smartploy -d smartploy_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SP10_NO_DEPLOY: "true"
      SMARTPLOY_TEST_DATABASE_URL: postgresql://smartploy:smartploy@127.0.0.1:5432/smartploy_test
    steps:
      - name: Checkout review-only CI proof helper
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout pinned exact candidate without credentials
        uses: actions/checkout@v4
        with:
          ref: c51a784153ec5ddc67ca6bc665209ce5fe04fdda
          path: candidate
          fetch-depth: 0
          persist-credentials: false

      - name: Set Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify main, all ten source heads and exact reviewed code tree
        run: python3 -B scripts/ci_sp10_outage_provenance.py verify

      - name: Install merged Python application
        run: |
          set -Eeuo pipefail
          cd candidate
          python -m pip install -e ".[dev]"

      - name: Run full candidate PostgreSQL tests, quality contracts and lint
        run: |
          set -Eeuo pipefail
          cd candidate
          python -m compileall -q smartploy scripts tests
          pytest -q
          python -m scripts.evaluate_search_quality
          python -m scripts.evaluate_human_relevance
          ruff check smartploy scripts tests

      - name: Run exact production React bundle and browser companion
        run: |
          set -Eeuo pipefail
          cd candidate/web
          npm install --no-audit --no-fund
          npm run test
          npm run build
          cd ..
          node --check browser-companion/logic.mjs
          node --check browser-companion/popup.mjs
          node --test browser-companion/tests/logic.test.mjs

      - name: Run synthetic Chromium end-to-end scenarios
        run: |
          set -Eeuo pipefail
          cd candidate/web
          npx playwright install --with-deps chromium
          npm run test:e2e

      - name: Issue application job source receipt only after all tests
        run: |
          python3 -B scripts/ci_sp10_outage_provenance.py receipt \
            --kind application --output sp10-application/receipt.json

      - name: Upload application receipt
        uses: actions/upload-artifact@v4
        with:
          name: sp10-outage-application-receipt
          path: sp10-application/receipt.json
          if-no-files-found: error
          retention-days: 7

  exact-candidate-docker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout review-only CI proof helper
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout pinned exact candidate without credentials
        uses: actions/checkout@v4
        with:
          ref: c51a784153ec5ddc67ca6bc665209ce5fe04fdda
          path: candidate
          fetch-depth: 0
          persist-credentials: false

      - name: Set Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned YAML fixture reader
        run: python -m pip install 'PyYAML==6.0.2'

      - name: Verify main, ten source heads and exact reviewed code tree
        run: python3 -B scripts/ci_sp10_outage_provenance.py verify

      - name: Run pinned original production Compose, migration, backups and restore on exact candidate
        run: python3 -B scripts/ci_sp10_outage_provenance.py docker

      - name: Issue Docker job source receipt only after successful restore
        run: |
          python3 -B scripts/ci_sp10_outage_provenance.py receipt \
            --kind docker --output sp10-docker/receipt.json

      - name: Upload Docker receipt
        uses: actions/upload-artifact@v4
        with:
          name: sp10-outage-docker-receipt
          path: sp10-docker/receipt.json
          if-no-files-found: error
          retention-days: 7

  cross-job-tree-attestation:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    needs:
      - exact-candidate-application
      - exact-candidate-docker
    steps:
      - name: Checkout read-only proof helper
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Download application job receipt
        uses: actions/download-artifact@v4
        with:
          name: sp10-outage-application-receipt
          path: sp10-proof/application

      - name: Download Docker job receipt
        uses: actions/download-artifact@v4
        with:
          name: sp10-outage-docker-receipt
          path: sp10-proof/docker

      - name: Verify independently tested application and Docker trees are identical
        run: python3 -B scripts/ci_sp10_outage_provenance.py attest

      - name: Archive review-only same-tree evidence
        uses: actions/upload-artifact@v4
        with:
          name: sp10-outage-identical-tree-review-evidence
          path: sp10-outage-joined-evidence.json
          if-no-files-found: error
          retention-days: 30
