name: SP11 one-time pinned npm lock bootstrap (remove after use)

on:
  pull_request:
    branches:
      - review/sp10-source-plus-outage-bcd95796-v1

permissions:
  contents: read

jobs:
  generate-and-verify:
    if: github.repository == 'galapoto/smartploy' && github.event.pull_request.head.repo.full_name == 'galapoto/smartploy' && github.event.pull_request.head.ref == 'feature/sp11-reproducible-web-dependencies-v1' && github.actor == 'galapoto'
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - name: Checkout only pinned source PR branch (no persisted credentials)
        uses: actions/checkout@v4
        with:
          ref: feature/sp11-reproducible-web-dependencies-v1
          persist-credentials: false
      - name: Node LTS 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Pin npm resolver
        run: |
          set -Eeuo pipefail
          npm install --global npm@10.9.2 --no-audit --no-fund
          test "$(npm --version)" = "10.9.2"
      - name: Generate deterministic npm v3 lock and test clean install
        run: |
          set -Eeuo pipefail
          test ! -e web/package-lock.json
          cd web
          npm install --package-lock-only --no-audit --no-fund --ignore-scripts
          node - <<'JS'
          const fs = require("node:fs");
          const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
          const lock = JSON.parse(fs.readFileSync("package-lock.json", "utf8"));
          if (lock.lockfileVersion !== 3 || lock.name !== pkg.name ||
              JSON.stringify(Object.entries(lock.packages[""].dependencies || {}).sort()) !==
              JSON.stringify(Object.entries(pkg.dependencies || {}).sort()) ||
              JSON.stringify(Object.entries(lock.packages[""].devDependencies || {}).sort()) !==
              JSON.stringify(Object.entries(pkg.devDependencies || {}).sort())) {
            throw new Error("Lockfile root does not match web/package.json");
          }
          const entries = Object.entries(lock.packages).filter(([key]) => key);
          if (entries.length < 10 || entries.some(([, value]) =>
              !value || typeof value.version !== "string" ||
              (value.resolved && !value.integrity))) {
            throw new Error("Lockfile dependency entries incomplete");
          }
          console.log("RESOLVED_DEPENDENCY_ENTRIES=" + entries.length);
          JS
          npm ci --no-audit --no-fund
          npm run test
          npm run build
          cd ..
          mkdir -p sp11-generated-lock
          cp web/package-lock.json sp11-generated-lock/package-lock.json
          (cd sp11-generated-lock && sha256sum package-lock.json > SHA256SUMS)
          git diff --exit-code -- web/package.json
          echo "GENERATED LOCK VERIFIED; NO APP OR PRODUCTION WRITES"
      - name: Upload resolved lockfile and checksum for restricted publisher
        uses: actions/upload-artifact@v4
        with:
          name: smartploy-sp11-pinned-npm-lock
          path: sp11-generated-lock/
          if-no-files-found: error
          retention-days: 7

  publish-once:
    needs: generate-and-verify
    if: github.repository == 'galapoto/smartploy' && github.event.pull_request.head.repo.full_name == 'galapoto/smartploy' && github.event.pull_request.head.ref == 'feature/sp11-reproducible-web-dependencies-v1' && github.actor == 'galapoto'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Checkout only designated source feature ref
        uses: actions/checkout@v4
        with:
          ref: feature/sp11-reproducible-web-dependencies-v1
          fetch-depth: 0
          persist-credentials: true
      - name: Read checked artifact
        uses: actions/download-artifact@v4
        with:
          name: smartploy-sp11-pinned-npm-lock
          path: sp11-generated-lock
      - name: Append only checked lock to designated new feature branch
        run: |
          set -Eeuo pipefail
          umask 077
          test "$GITHUB_REPOSITORY" = "galapoto/smartploy"
          test "$GITHUB_HEAD_REF" = "feature/sp11-reproducible-web-dependencies-v1"
          test ! -e web/package-lock.json
          git merge-base --is-ancestor c51a784153ec5ddc67ca6bc665209ce5fe04fdda HEAD
          test -z "$(git status --porcelain --untracked-files=no)"
          (cd sp11-generated-lock && sha256sum --check SHA256SUMS)
          cp sp11-generated-lock/package-lock.json web/package-lock.json
          node - <<'JS'
          const fs = require("node:fs");
          const pkg = JSON.parse(fs.readFileSync("web/package.json", "utf8"));
          const lock = JSON.parse(fs.readFileSync("web/package-lock.json", "utf8"));
          if (lock.lockfileVersion !== 3 ||
              JSON.stringify(Object.entries(pkg.dependencies || {}).sort()) !==
              JSON.stringify(Object.entries(lock.packages[""].dependencies || {}).sort()) ||
              JSON.stringify(Object.entries(pkg.devDependencies || {}).sort()) !==
              JSON.stringify(Object.entries(lock.packages[""].devDependencies || {}).sort())) {
            throw new Error("Lockfile manifest mismatch; refusing source commit");
          }
          JS
          git add web/package-lock.json
          test "$(git diff --cached --name-only)" = "web/package-lock.json"
          git diff --cached --check
          git config user.name "SmartPloy CI lock generator"
          git config user.email "ci-lock@users.noreply.github.com"
          original="$(git rev-parse HEAD)"
          git commit -m "Pin web dependency resolution with npm 10.9.2 lockfile"
          git push --force-with-lease=refs/heads/feature/sp11-reproducible-web-dependencies-v1:$original origin HEAD:refs/heads/feature/sp11-reproducible-web-dependencies-v1
          echo "LOCKFILE COMMITTED TO FEATURE BRANCH ONLY; MAIN AND OVH UNTOUCHED"
