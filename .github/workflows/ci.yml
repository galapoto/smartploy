name: Smartploy CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: smartploy
          POSTGRES_PASSWORD: smartploy
          POSTGRES_DB: smartploy_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U smartploy -d smartploy_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SMARTPLOY_TEST_DATABASE_URL: postgresql://smartploy:smartploy@127.0.0.1:5432/smartploy_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Compile
        run: python -m compileall smartploy scripts tests
      - name: Test
        run: pytest -q
      - name: Lint
        run: ruff check smartploy scripts tests

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install web dependencies
        working-directory: web
        run: npm install --no-audit --no-fund
      - name: Web tests
        working-directory: web
        run: npm run test
      - name: Web build
        working-directory: web
        run: npm run build
