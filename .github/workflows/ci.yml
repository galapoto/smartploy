name: Smartploy CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: smartploy
          POSTGRES_PASSWORD: smartploy
          POSTGRES_DB: smartploy_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U smartploy -d smartploy_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SMARTPLOY_TEST_DATABASE_URL: postgresql://smartploy:smartploy@127.0.0.1:5432/smartploy_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Compile
        run: python -m compileall smartploy scripts tests
      - name: Test
        run: pytest -q
      - name: Lint
        run: ruff check smartploy scripts tests

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install web dependencies
        working-directory: web
        run: npm install --no-audit --no-fund
      - name: Web tests
        working-directory: web
        run: npm run test
      - name: Browser companion JS and security checks
        run: |
          node --check browser-companion/logic.mjs
          node --check browser-companion/popup.mjs
          node --test browser-companion/tests/logic.test.mjs
      - name: Web build
        working-directory: web
        run: npm run build

  deploy-stack:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Prepare fixture production environment
        run: |
          cp deploy/personal/env.example deploy/personal/env
          python - <<'PY'
          from pathlib import Path

          path = Path("deploy/personal/env")
          text = path.read_text(encoding="utf-8")
          replacements = {
              "POSTGRES_PASSWORD=replace-with-url-safe-random-password":
                  "POSTGRES_PASSWORD=ci-url-safe-random-password-1234567890",
              "SMARTPLOY_ACCESS_ISSUER=https://your-team.cloudflareaccess.com":
                  "SMARTPLOY_ACCESS_ISSUER=https://ci.cloudflareaccess.com",
              "SMARTPLOY_ACCESS_AUDIENCE=replace-with-smartploy-access-audience":
                  "SMARTPLOY_ACCESS_AUDIENCE=ci-smartploy-access-audience-123456",
              "SMARTPLOY_ACCESS_ALLOWED_EMAIL=replace-with-approved-owner-email":
                  "SMARTPLOY_ACCESS_ALLOWED_EMAIL=ci@example.com",
              "OBUMAI_BASE_URL=https://app.obumai.com":
                  "OBUMAI_BASE_URL=",
              "SMARTPLOY_WEB_HOST_PORT=8091":
                  "SMARTPLOY_WEB_HOST_PORT=18091",
              "SMARTPLOY_BACKUP_DIR=/srv/obum/backups/smartploy":
                  "SMARTPLOY_BACKUP_DIR=/tmp/smartploy-backups",
              "SMARTPLOY_DEPLOY_STATE_DIR=/srv/obum/data/smartploy/deploy-state":
                  "SMARTPLOY_DEPLOY_STATE_DIR=/tmp/smartploy-deploy-state",
          }
          for old, new in replacements.items():
              text = text.replace(old, new)
          path.write_text(text, encoding="utf-8")
          PY
          chmod 600 deploy/personal/env
      - name: Run no-mutation production preflight
        run: bash deploy/personal/scripts/preflight.sh
      - name: Validate committed production policy
        run: bash deploy/personal/scripts/validate-runtime-policy.sh deploy/personal/runtime.production.env
      - name: Build and smoke production Compose stack
        run: |
          set -euo pipefail
          DEPLOY_SHA="$(git rev-parse HEAD)"
          export SMARTPLOY_IMAGE_TAG="${DEPLOY_SHA:0:12}"
          COMPOSE=(
            docker compose
            --env-file deploy/personal/env
            --env-file deploy/personal/runtime.production.env
            -f deploy/personal/docker-compose.yml
          )
          cleanup() {
            "${COMPOSE[@]}" down -v --remove-orphans >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          "${COMPOSE[@]}" config > /tmp/smartploy-compose.yml
          "${COMPOSE[@]}" build api web
          "${COMPOSE[@]}" up -d --wait postgres
          "${COMPOSE[@]}" run --rm --no-deps api python scripts/migrate.py
          "${COMPOSE[@]}" up -d --wait --wait-timeout 120 --no-deps --force-recreate api
          "${COMPOSE[@]}" up -d --no-deps --force-recreate worker web

          for _ in $(seq 1 60); do
            running="$("${COMPOSE[@]}" ps --status running --services)"
            if grep -qx api <<<"${running}" \
              && grep -qx worker <<<"${running}" \
              && grep -qx web <<<"${running}"; then
              break
            fi
            sleep 1
          done

          bash deploy/personal/scripts/smoke-env-boundaries.sh
          # The worker image has an API healthcheck by default; a worker-specific
          # override must prove that all four services are actually healthy.
          bash deploy/personal/scripts/assert-healthy-stack.sh
          bash deploy/personal/scripts/assert-running-images.sh "${DEPLOY_SHA}"
          # Negative control: tag an unrelated existing image as a fake release;
          # the image-ID gate must detect that the running containers are stale.
          BAD_SHA="0000000000000000000000000000000000000000"
          docker tag "smartploy-web:${SMARTPLOY_IMAGE_TAG}" "smartploy-api:000000000000"
          docker tag "smartploy-web:${SMARTPLOY_IMAGE_TAG}" "smartploy-web:000000000000"
          if bash deploy/personal/scripts/assert-running-images.sh "${BAD_SHA}" > /tmp/smartploy-stale-image-check.log 2>&1; then
            echo "image provenance accepted stale service containers" >&2
            exit 1
          fi

          for _ in $(seq 1 60); do
            if curl --fail --silent \
              -H 'Host: smartploy.obumai.com' \
              http://127.0.0.1:18091/healthz > /tmp/smartploy-health.json; then
              break
            fi
            sleep 2
          done

          python - <<'PY'
          import json
          from pathlib import Path

          health = json.loads(Path("/tmp/smartploy-health.json").read_text(encoding="utf-8"))
          assert health["ok"] is True
          assert health["public_origin"] == "https://smartploy.obumai.com"
          assert health["storage"]["ready"] is True
          assert health["access"]["enabled"] is True
          assert health["access"]["environment"] == "production"
          assert health["access"]["owner_restricted"] is True
          assert health["external_actions_authorized"] is False
          PY

          status="$(
            curl --silent --output /tmp/smartploy-denied.json --write-out '%{http_code}' \
              -H 'Host: smartploy.obumai.com' \
              http://127.0.0.1:18091/api/v1/dashboard
          )"
          test "${status}" = "401"

          running="$("${COMPOSE[@]}" ps --status running --services)"
          for service in postgres api worker web; do
            grep -qx "${service}" <<<"${running}"
          done

          # Exercise the real production backup/restore path.
          mkdir -p /tmp/smartploy-deploy-state
          chmod 700 /tmp/smartploy-deploy-state
          git rev-parse HEAD > /tmp/smartploy-deploy-state/deployed-sha
          date -u +'%Y-%m-%dT%H:%M:%SZ' > /tmp/smartploy-deploy-state/deployed-at

          "${COMPOSE[@]}" exec -T postgres sh -c \
            'psql -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" -c "DROP TABLE IF EXISTS smartploy_restore_probe; CREATE TABLE smartploy_restore_probe (value text NOT NULL); INSERT INTO smartploy_restore_probe(value) VALUES ('"'"'before-restore'"'"');"'

          BACKUP_OUTPUT="$(bash deploy/personal/scripts/backup.sh)"
          BACKUP_FILE="${BACKUP_OUTPUT#Backup created: }"
          test "${BACKUP_FILE}" != "${BACKUP_OUTPUT}"
          test -s "${BACKUP_FILE}"
          test -s "${BACKUP_FILE}.sha256"
          test -s "${BACKUP_FILE}.meta"
          grep -Fxq 'format=smartploy-db-backup-v1' "${BACKUP_FILE}.meta"
          grep -Fxq "source_deployed_sha=$(git rev-parse HEAD)" "${BACKUP_FILE}.meta"

          "${COMPOSE[@]}" exec -T postgres sh -c \
            'psql -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" -c "DELETE FROM smartploy_restore_probe;"'
          probe_before="$("${COMPOSE[@]}" exec -T postgres sh -c 'psql -At -U "$POSTGRES_USER" -d "$POSTGRES_DB" -c "SELECT count(*) FROM smartploy_restore_probe;"')"
          test "${probe_before}" = "0"

          bash deploy/personal/scripts/restore.sh "${BACKUP_FILE}"

          probe_after="$("${COMPOSE[@]}" exec -T postgres sh -c 'psql -At -U "$POSTGRES_USER" -d "$POSTGRES_DB" -c "SELECT count(*) FROM smartploy_restore_probe WHERE value='"'"'before-restore'"'"';"')"
          test "${probe_after}" = "1"

          RESTORE_EVIDENCE="$(find /tmp/smartploy-deploy-state -maxdepth 1 -type f -name 'restore-*.txt' | sort | tail -n 1)"
          test -s "${RESTORE_EVIDENCE}"
          grep -Fxq 'format=smartploy-db-restore-v1' "${RESTORE_EVIDENCE}"
          grep -Fxq 'health_verified=true' "${RESTORE_EVIDENCE}"
          EXPECTED_RESTORE_SHA="backup_sha256=$(awk 'NR == 1 {print $1}' "${BACKUP_FILE}.sha256")"
          grep -Fxq "${EXPECTED_RESTORE_SHA}" "${RESTORE_EVIDENCE}"

          EVIDENCE_OUTPUT="$(bash deploy/personal/scripts/release-evidence.sh)"
          EVIDENCE_FILE="$(
            printf '%s\n' "${EVIDENCE_OUTPUT}" \
              | sed -n 's/^Evidence artifact: //p' \
              | tail -n 1
          )"
          test -n "${EVIDENCE_FILE}"
          test -s "${EVIDENCE_FILE}"
          test -s "${EVIDENCE_FILE}.sha256"
          test "$(stat -c '%a' "${EVIDENCE_FILE}")" = "600"
          test "$(stat -c '%a' "${EVIDENCE_FILE}.sha256")" = "600"
          (
            cd "$(dirname "${EVIDENCE_FILE}")"
            sha256sum -c "$(basename "${EVIDENCE_FILE}").sha256"
          )

          DEPLOYED_SHA="$(git rev-parse HEAD)"
          grep -Fxq 'format=smartploy-release-evidence-v1' "${EVIDENCE_FILE}"
          grep -Fxq "current_code_sha=${DEPLOYED_SHA}" "${EVIDENCE_FILE}"
          grep -Fxq "deployed_sha=${DEPLOYED_SHA}" "${EVIDENCE_FILE}"
          grep -Fxq 'deployed_sha_matches_code=true' "${EVIDENCE_FILE}"
          grep -Fxq 'storage_ready=true' "${EVIDENCE_FILE}"
          grep -Fxq 'access_enabled=true' "${EVIDENCE_FILE}"
          grep -Fxq 'access_environment=production' "${EVIDENCE_FILE}"
          grep -Fxq 'access_owner_restricted=true' "${EVIDENCE_FILE}"
          grep -Fxq 'external_actions_authorized=false' "${EVIDENCE_FILE}"
          grep -Fxq 'latest_backup_metadata_valid=true' "${EVIDENCE_FILE}"
          grep -Fxq 'preflight_passed=true' "${EVIDENCE_FILE}"
          grep -Fxq 'env_boundary_smoke_passed=true' "${EVIDENCE_FILE}"
          grep -Fxq 'stack_healthy=true' "${EVIDENCE_FILE}"
          grep -Fxq 'running_release_images_verified=true' "${EVIDENCE_FILE}"
          grep -Fxq 'live_acceptance=skipped' "${EVIDENCE_FILE}"

          # Evidence must never contain fixture secret/private configuration values.
          ! grep -Fq 'ci-url-safe-random-password-1234567890' "${EVIDENCE_FILE}"
          ! grep -Fq 'ci.cloudflareaccess.com' "${EVIDENCE_FILE}"
          ! grep -Fq 'ci-smartploy-access-audience-123456' "${EVIDENCE_FILE}"
          ! grep -Fq 'ci@example.com' "${EVIDENCE_FILE}"
