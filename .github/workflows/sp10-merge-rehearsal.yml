name: SP-10 exact source merge rehearsal (CI only)

on:
  pull_request:
  workflow_dispatch:

# A read-only worker: no deploy keys, cloud tokens, image registries or SSH.
permissions:
  contents: read

jobs:
  pinned-nine-source-docker-stack:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Separate from the synthetic PostgreSQL service job: the original
    # production-stack fixture owns a temporary Compose PostgreSQL port.
    steps:
      - name: Checkout CI-only harness without push permissions
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install matching Python runtime
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install safe YAML parser used only for pinned CI step extraction
        run: python -m pip install 'PyYAML==6.0.2'

      - name: Verify and merge exact nine-source histories in disposable worktree
        run: python3 -B scripts/ci_merge_rehearsal.py

      - name: Run pinned fixture stack/migrations/backup/restore against ACTUAL merged tree
        run: python3 -B scripts/ci_merged_docker_acceptance.py

      - name: Collect safe Docker rehearsal receipt
        if: always()
        run: |
          mkdir -p sp10-docker-artifacts
          if test -f "$RUNNER_TEMP/smartploy-rehearsal-summary.json"; then
            cp "$RUNNER_TEMP/smartploy-rehearsal-summary.json" sp10-docker-artifacts/
          fi

      - name: Upload read-only Docker rehearsal metadata
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smartploy-nine-source-docker-rehearsal
          path: sp10-docker-artifacts/
          if-no-files-found: ignore
          retention-days: 7

  pinned-nine-source-rehearsal:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: smartploy
          POSTGRES_PASSWORD: smartploy
          POSTGRES_DB: smartploy_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U smartploy -d smartploy_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SMARTPLOY_TEST_DATABASE_URL: postgresql://smartploy:smartploy@127.0.0.1:5432/smartploy_test
    steps:
      - name: Checkout CI-only harness (not a release)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install matching Python runtime
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install matching Node runtime
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify main pin and merge all nine exact PR heads in disposable worktree
        run: python3 -B scripts/ci_merge_rehearsal.py

      - name: Install integrated Python requirements
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/smartploy-nine-source-rehearsal"
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Compile and test ACTUAL merged source tree using isolated PostgreSQL
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/smartploy-nine-source-rehearsal"
          python -m compileall -q smartploy scripts tests
          pytest -q
          python -m scripts.evaluate_search_quality
          python -m scripts.evaluate_human_relevance
          ruff check smartploy scripts tests

      - name: Install web packages and run React/build/companion checks
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/smartploy-nine-source-rehearsal/web"
          npm install --no-audit --no-fund
          npm run test
          npm run build
          cd ..
          node --check browser-companion/logic.mjs
          node --check browser-companion/popup.mjs
          node --test browser-companion/tests/logic.test.mjs

      - name: Install Chromium and run synthetic end-to-end tests
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/smartploy-nine-source-rehearsal/web"
          npx playwright install --with-deps chromium
          npm run test:e2e

      - name: Collect safe result metadata
        if: always()
        run: |
          mkdir -p sp10-rehearsal-artifacts
          if test -f "$RUNNER_TEMP/smartploy-rehearsal-summary.json"; then
            cp "$RUNNER_TEMP/smartploy-rehearsal-summary.json" sp10-rehearsal-artifacts/
          fi

      - name: Upload rehearsal receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smartploy-nine-source-merge-rehearsal
          path: sp10-rehearsal-artifacts/
          if-no-files-found: ignore
          retention-days: 7

  pinned-rehearsal-tree-attestation:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    needs:
      - pinned-nine-source-rehearsal
      - pinned-nine-source-docker-stack
    steps:
      - name: Checkout read-only receipt verifier
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Download application source-tree receipt
        uses: actions/download-artifact@v4
        with:
          name: smartploy-nine-source-merge-rehearsal
          path: sp10-proof/application

      - name: Download Docker fixture source-tree receipt
        uses: actions/download-artifact@v4
        with:
          name: smartploy-nine-source-docker-rehearsal
          path: sp10-proof/docker

      - name: Verify identical source tree and nine pinned source PRs
        run: python3 -B scripts/ci_cross_job_rehearsal.py

      - name: Save joined provenance evidence without user data
        uses: actions/upload-artifact@v4
        with:
          name: smartploy-nine-source-joined-evidence
          path: sp10-joined-evidence.json
          if-no-files-found: error
          retention-days: 7
