name: smartploy

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-smartploy}
      POSTGRES_USER: ${POSTGRES_USER:-smartploy}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/personal/env}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - smartploy-postgres:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 10
    security_opt:
      - no-new-privileges:true
    networks:
      - smartploy-private

  api:
    build:
      context: ../..
      dockerfile: Dockerfile
      args:
        APP_VERSION: ${SMARTPLOY_IMAGE_TAG:-dev}
    image: smartploy-api:${SMARTPLOY_IMAGE_TAG:-dev}
    restart: unless-stopped
    init: true
    environment:
      SMARTPLOY_DATABASE_URL: postgresql://${POSTGRES_USER:-smartploy}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-smartploy}
      SMARTPLOY_PROFILE_ID: ${SMARTPLOY_PROFILE_ID:-default}
      SMARTPLOY_ENVIRONMENT: ${SMARTPLOY_ENVIRONMENT:-production}
      SMARTPLOY_HOST: ${SMARTPLOY_HOST:-0.0.0.0}
      SMARTPLOY_PORT: ${SMARTPLOY_PORT:-8090}
      SMARTPLOY_PUBLIC_ORIGIN: ${SMARTPLOY_PUBLIC_ORIGIN:-https://smartploy.obumai.com}
      SMARTPLOY_ALLOWED_HOSTS: ${SMARTPLOY_ALLOWED_HOSTS:-smartploy.obumai.com}
      SMARTPLOY_AUTH_MODE: ${SMARTPLOY_AUTH_MODE:-cloudflare}
      SMARTPLOY_ACCESS_ENABLED: ${SMARTPLOY_ACCESS_ENABLED:-true}
      SMARTPLOY_ACCESS_ISSUER: ${SMARTPLOY_ACCESS_ISSUER:-}
      SMARTPLOY_ACCESS_AUDIENCE: ${SMARTPLOY_ACCESS_AUDIENCE:-}
      SMARTPLOY_ACCESS_ALLOWED_EMAIL: ${SMARTPLOY_ACCESS_ALLOWED_EMAIL:-}
      # Stable server-issued usr-ID allowlist for shared source-write APIs only.
      SMARTPLOY_OPERATOR_USER_IDS: ${SMARTPLOY_OPERATOR_USER_IDS:-}
      SMARTPLOY_OIDC_ISSUER: ${SMARTPLOY_OIDC_ISSUER:-}
      SMARTPLOY_OIDC_CLIENT_ID: ${SMARTPLOY_OIDC_CLIENT_ID:-}
      SMARTPLOY_OIDC_REDIRECT_URI: ${SMARTPLOY_OIDC_REDIRECT_URI:-}
      SMARTPLOY_OIDC_POST_LOGOUT_REDIRECT_URI: ${SMARTPLOY_OIDC_POST_LOGOUT_REDIRECT_URI:-}
      SMARTPLOY_OIDC_SCOPE: ${SMARTPLOY_OIDC_SCOPE:-openid profile email}
      # Per-POSTING official partner API configuration and employer-admin keys.
      # API container only. Never inject into web, worker or postgres.
      # Unset by default; code always denies automated external transfer.
      SMARTPLOY_LEVER_PARTNER_JOBS_JSON: ${SMARTPLOY_LEVER_PARTNER_JOBS_JSON:-}
      SMARTPLOY_LEVER_PARTNER_KEY_PRIMARY: ${SMARTPLOY_LEVER_PARTNER_KEY_PRIMARY:-}
      SMARTPLOY_LEVER_PARTNER_KEY_SECONDARY: ${SMARTPLOY_LEVER_PARTNER_KEY_SECONDARY:-}
      SMARTPLOY_LEVER_PARTNER_KEY_TERTIARY: ${SMARTPLOY_LEVER_PARTNER_KEY_TERTIARY:-}
      SMARTPLOY_SESSION_TTL_SECONDS: ${SMARTPLOY_SESSION_TTL_SECONDS:-43200}
      SMARTPLOY_OIDC_STATE_TTL_SECONDS: ${SMARTPLOY_OIDC_STATE_TTL_SECONDS:-600}
      OBUMAI_BASE_URL: ${OBUMAI_BASE_URL:-}
      OBUMAI_AGENT_ID: ${OBUMAI_AGENT_ID:-obum-assistant}
      OBUMAI_TIMEOUT_SECONDS: ${OBUMAI_TIMEOUT_SECONDS:-15}
      OBUMAI_HTTP_HEADERS_JSON: ${OBUMAI_HTTP_HEADERS_JSON:-{}}
      SMARTPLOY_LOCAL_AI_ENABLED: ${SMARTPLOY_LOCAL_AI_ENABLED:-false}
      SMARTPLOY_LOCAL_AI_BASE_URL: ${SMARTPLOY_LOCAL_AI_BASE_URL:-}
      SMARTPLOY_LOCAL_AI_MODEL: ${SMARTPLOY_LOCAL_AI_MODEL:-qwen3:4b}
      SMARTPLOY_LOCAL_AI_TIMEOUT_SECONDS: ${SMARTPLOY_LOCAL_AI_TIMEOUT_SECONDS:-75}
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "8090"
    extra_hosts:
      - host.docker.internal:host-gateway
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; r=urllib.request.Request('http://127.0.0.1:8090/healthz', headers={'Host':'smartploy.obumai.com'}); urllib.request.urlopen(r, timeout=4).read(256)
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    security_opt:
      - no-new-privileges:true
    networks:
      - smartploy-private

  worker:
    image: smartploy-api:${SMARTPLOY_IMAGE_TAG:-dev}
    restart: unless-stopped
    init: true
    command:
      - python
      - scripts/source_worker.py
    environment:
      SMARTPLOY_DATABASE_URL: postgresql://${POSTGRES_USER:-smartploy}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-smartploy}
      SMARTPLOY_PROFILE_ID: ${SMARTPLOY_PROFILE_ID:-default}
      # Explicit runtime classification; production refuses global unattended
      # candidate-data forwarding even if the operator flag is accidentally true.
      SMARTPLOY_ENVIRONMENT: ${SMARTPLOY_ENVIRONMENT:-production}

      OBUMAI_BASE_URL: ${OBUMAI_BASE_URL:-}
      OBUMAI_AGENT_ID: ${OBUMAI_AGENT_ID:-obum-assistant}
      OBUMAI_TIMEOUT_SECONDS: ${OBUMAI_TIMEOUT_SECONDS:-15}
      OBUMAI_HTTP_HEADERS_JSON: ${OBUMAI_HTTP_HEADERS_JSON:-{}}

      JOBMARKET_FINLAND_API_ENABLED: ${JOBMARKET_FINLAND_API_ENABLED:-false}
      JOBMARKET_FINLAND_ENVIRONMENT: ${JOBMARKET_FINLAND_ENVIRONMENT:-test}
      JOBMARKET_FINLAND_ENDPOINT: ${JOBMARKET_FINLAND_ENDPOINT:-}
      JOBMARKET_FINLAND_KIPA_SUBSCRIPTION_KEY: ${JOBMARKET_FINLAND_KIPA_SUBSCRIPTION_KEY:-}
      JOBMARKET_FINLAND_HTTP_HEADERS_JSON: ${JOBMARKET_FINLAND_HTTP_HEADERS_JSON:-{}}
      JOBMARKET_FINLAND_POSTING_LANGUAGES: ${JOBMARKET_FINLAND_POSTING_LANGUAGES:-fi,en,sv}
      JOBMARKET_FINLAND_TIMEOUT_SECONDS: ${JOBMARKET_FINLAND_TIMEOUT_SECONDS:-20}
      JOBMARKET_FINLAND_MAX_BYTES: ${JOBMARKET_FINLAND_MAX_BYTES:-26214400}
      JOBMARKET_FINLAND_MAX_ITEMS: ${JOBMARKET_FINLAND_MAX_ITEMS:-10000}
      JOBMARKET_FINLAND_INITIAL_LOOKBACK_MINUTES: ${JOBMARKET_FINLAND_INITIAL_LOOKBACK_MINUTES:-120}
      JOBMARKET_FINLAND_OVERLAP_MINUTES: ${JOBMARKET_FINLAND_OVERLAP_MINUTES:-5}

      KUNTAREKRY_FEED_URL: ${KUNTAREKRY_FEED_URL:-}
      KUNTAREKRY_ALLOWED_HOSTS: ${KUNTAREKRY_ALLOWED_HOSTS:-kuntarekry.fi}
      KUNTAREKRY_TIMEOUT_SECONDS: ${KUNTAREKRY_TIMEOUT_SECONDS:-15}
      KUNTAREKRY_MAX_BYTES: ${KUNTAREKRY_MAX_BYTES:-5242880}
      KUNTAREKRY_HTTP_HEADERS_JSON: ${KUNTAREKRY_HTTP_HEADERS_JSON:-{}}

      SMARTPLOY_PUBLIC_ATS_SOURCES_JSON: ${SMARTPLOY_PUBLIC_ATS_SOURCES_JSON:-}
      SMARTPLOY_PUBLIC_ATS_SOURCES_FILE: ${SMARTPLOY_PUBLIC_ATS_SOURCES_FILE:-}
      SMARTPLOY_PUBLIC_ATS_TIMEOUT_SECONDS: ${SMARTPLOY_PUBLIC_ATS_TIMEOUT_SECONDS:-15}
      SMARTPLOY_PUBLIC_ATS_PAGE_SIZE: ${SMARTPLOY_PUBLIC_ATS_PAGE_SIZE:-100}
      SMARTPLOY_PUBLIC_ATS_MAX_ITEMS: ${SMARTPLOY_PUBLIC_ATS_MAX_ITEMS:-10000}
      SMARTPLOY_PUBLIC_ATS_MAX_RESPONSE_BYTES: ${SMARTPLOY_PUBLIC_ATS_MAX_RESPONSE_BYTES:-10485760}

      SMARTPLOY_WORKER_LOOP_SECONDS: ${SMARTPLOY_WORKER_LOOP_SECONDS:-15}
      SMARTPLOY_WORKER_LEASE_SECONDS: ${SMARTPLOY_WORKER_LEASE_SECONDS:-900}
      SMARTPLOY_WORKER_MAX_BACKOFF_SECONDS: ${SMARTPLOY_WORKER_MAX_BACKOFF_SECONDS:-3600}
      SMARTPLOY_WORKER_CLAIM_LIMIT: ${SMARTPLOY_WORKER_CLAIM_LIMIT:-8}
      SMARTPLOY_WORKER_OWNER: ${SMARTPLOY_WORKER_OWNER:-}
      SMARTPLOY_WORKER_JOBMARKET_CADENCE_SECONDS: ${SMARTPLOY_WORKER_JOBMARKET_CADENCE_SECONDS:-300}
      SMARTPLOY_WORKER_KUNTAREKRY_CADENCE_SECONDS: ${SMARTPLOY_WORKER_KUNTAREKRY_CADENCE_SECONDS:-600}
      SMARTPLOY_WORKER_PUBLIC_ATS_CADENCE_SECONDS: ${SMARTPLOY_WORKER_PUBLIC_ATS_CADENCE_SECONDS:-600}
      # Defaults OFF; enabling can forward approved profile evidence to ObumAI.
      # Local draft staging only; per-user signed-in opt-in remains mandatory.
      SMARTPLOY_WORKER_MATCHED_DRAFTS_ENABLED: ${SMARTPLOY_WORKER_MATCHED_DRAFTS_ENABLED:-false}
      SMARTPLOY_WORKER_MATCHED_DRAFTS_CADENCE_SECONDS: ${SMARTPLOY_WORKER_MATCHED_DRAFTS_CADENCE_SECONDS:-600}
      SMARTPLOY_WORKER_AUTO_PREPARE_ENABLED: ${SMARTPLOY_WORKER_AUTO_PREPARE_ENABLED:-false}
      SMARTPLOY_WORKER_PREPARE_CADENCE_SECONDS: ${SMARTPLOY_WORKER_PREPARE_CADENCE_SECONDS:-120}
      SMARTPLOY_WORKER_REFRESH_CADENCE_SECONDS: ${SMARTPLOY_WORKER_REFRESH_CADENCE_SECONDS:-60}
      SMARTPLOY_PREPARE_BATCH_LIMIT: ${SMARTPLOY_PREPARE_BATCH_LIMIT:-20}
      SMARTPLOY_REFRESH_BATCH_LIMIT: ${SMARTPLOY_REFRESH_BATCH_LIMIT:-50}
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_healthy
    extra_hosts:
      - host.docker.internal:host-gateway
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    healthcheck:
      test:
        - CMD
        - python
        - -m
        - smartploy.worker_health
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    security_opt:
      - no-new-privileges:true
    networks:
      - smartploy-private

  web:
    build:
      context: ../..
      dockerfile: web/Dockerfile
    image: smartploy-web:${SMARTPLOY_IMAGE_TAG:-dev}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - 127.0.0.1:${SMARTPLOY_WEB_HOST_PORT:-8091}:8080
    healthcheck:
      test:
        - CMD-SHELL
        - "wget -qO- --header='Host: smartploy.obumai.com' http://127.0.0.1:8080/healthz >/dev/null"
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    security_opt:
      - no-new-privileges:true
    networks:
      - smartploy-private

networks:
  smartploy-private:
    driver: bridge

volumes:
  smartploy-postgres:
    name: smartploy-postgres
