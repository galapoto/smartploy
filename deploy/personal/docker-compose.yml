name: smartploy

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-smartploy}
      POSTGRES_USER: ${POSTGRES_USER:-smartploy}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/personal/env}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - smartploy-postgres:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 10
    security_opt:
      - no-new-privileges:true
    networks:
      - smartploy-private

  api:
    build:
      context: ../..
      dockerfile: Dockerfile
      args:
        APP_VERSION: ${SMARTPLOY_IMAGE_TAG:-dev}
    image: smartploy-api:${SMARTPLOY_IMAGE_TAG:-dev}
    restart: unless-stopped
    init: true
    env_file:
      - ./env
      - ./runtime.production.env
    environment:
      SMARTPLOY_DATABASE_URL: postgresql://${POSTGRES_USER:-smartploy}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-smartploy}
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "8090"
    extra_hosts:
      - host.docker.internal:host-gateway
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; r=urllib.request.Request('http://127.0.0.1:8090/healthz', headers={'Host':'smartploy.obumai.com'}); urllib.request.urlopen(r, timeout=4).read(256)
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    security_opt:
      - no-new-privileges:true
    networks:
      - smartploy-private

  worker:
    image: smartploy-api:${SMARTPLOY_IMAGE_TAG:-dev}
    restart: unless-stopped
    init: true
    command:
      - python
      - scripts/source_worker.py
    env_file:
      - ./env
      - ./runtime.production.env
    environment:
      SMARTPLOY_DATABASE_URL: postgresql://${POSTGRES_USER:-smartploy}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-smartploy}
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_healthy
    extra_hosts:
      - host.docker.internal:host-gateway
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    networks:
      - smartploy-private

  web:
    build:
      context: ../..
      dockerfile: web/Dockerfile
    image: smartploy-web:${SMARTPLOY_IMAGE_TAG:-dev}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - 127.0.0.1:${SMARTPLOY_WEB_HOST_PORT:-8091}:8080
    healthcheck:
      test:
        - CMD-SHELL
        - "wget -qO- --header='Host: smartploy.obumai.com' http://127.0.0.1:8080/healthz >/dev/null"
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    security_opt:
      - no-new-privileges:true
    networks:
      - smartploy-private

networks:
  smartploy-private:
    driver: bridge

volumes:
  smartploy-postgres:
    name: smartploy-postgres
