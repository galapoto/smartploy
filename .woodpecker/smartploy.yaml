# ObumDelivery Woodpecker 3.19 pipeline; KVM isolated-build worker only.
# Does NOT deploy to OVH or carry Cloudflare/DB/AI secrets.
labels:
  workload: isolated-build

when:
  - event: manual
  - event: push
    # Opt in the reviewed SP15j application train, never all draft branches.
    branch: [main, feature/sp15j-auto-it-discovery-private-drafts-20261020-v1]

services:
  - name: postgres
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: smartploy_test
      POSTGRES_USER: smartploy
      POSTGRES_PASSWORD: synthetic-local-ci-only

steps:
  - name: python-postgres
    image: python:3.12-bookworm
    environment:
      CI: "true"
      SMARTPLOY_TEST_DATABASE_URL: postgresql://smartploy:synthetic-local-ci-only@postgres:5432/smartploy_test
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    commands:
      - python3 -B scripts/obumdelivery_ci_gate.py validate
      # Deliberate RED identity probe: it MUST return exactly 41 and
      # never produce a successful source receipt. Check this on the
      # native isolated worker, not only in GitHub/Python unit tests.
      - |
        set -eu
        negative_status=0
        CI_NEGATIVE_PROBE=1 python3 -B scripts/obumdelivery_ci_gate.py validate \
          > /tmp/smartploy-expected-red.log 2>&1 || negative_status=$?
        test "$negative_status" -eq 41
        grep -Fq 'EXPECTED_RED_NEGATIVE_PROBE' /tmp/smartploy-expected-red.log
        rm -f /tmp/smartploy-expected-red.log
        echo "OBUMDELIVERY_EXPECTED_RED_NEGATIVE_CONTROL_VERIFIED"
      - python3 -m pip install --no-cache-dir -e ".[dev]"
      - python3 -B -m scripts.ci_wait_postgres
      - python3 -m compileall smartploy scripts tests
      - python3 -m pytest -q
      # SP46: independent re-run of the FULL owner CV-to-provider-to-agent
      # acceptance contract, with local mock transport and original Postgres.
      - python3 -m pytest -q tests/test_autoapply_e2e_contract.py
      - python3 -m scripts.evaluate_search_quality
      - python3 -m scripts.evaluate_human_relevance
      - ruff check smartploy scripts tests
      - python3 -B scripts/obumdelivery_ci_gate.py mark-python

  - name: web-browser
    image: mcr.microsoft.com/playwright:v1.55.1-noble
    depends_on: [python-postgres]
    environment:
      CI: "true"
    commands:
      # SP44/45: the first-party ZIP packager uses Python stdlib only.
      # Install Python in this isolated build image IF absent; never inject
      # an extension from external repositories or npm postinstall code.
      - |
        set -eu
        if ! command -v python3 >/dev/null 2>&1; then
          apt-get update -qq
          apt-get install -y --no-install-recommends python3
        fi
        python3 --version
      - node --version
      - npm install --global npm@10.9.2 --no-audit --no-fund
      - test "$(npm --version)" = "10.9.2"
      - cd web && npm ci --no-audit --no-fund && npm run test && npm run build && npm run test:e2e && cd ..
      - node --check browser-companion/logic.mjs
      - node --check browser-companion/popup.mjs
      - node --check browser-companion/upload.mjs
      - node --check browser-companion/page-attachment.mjs
      - node --check browser-companion/questions.mjs
      - node --check browser-companion/page-questions.mjs
      - node --check browser-companion/attempt-lock.mjs
      - node --test browser-companion/tests/*.test.mjs

  - name: exact-source-hold-receipt
    image: python:3.12-bookworm
    depends_on: [web-browser]
    environment:
      CI: "true"
    commands:
      - python3 -B scripts/obumdelivery_ci_gate.py mark-browser
      - python3 -B scripts/obumdelivery_ci_gate.py final
      - echo "OBUMDELIVERY_SMARTPLOY_PRODUCT_CI_PASS; PRODUCTION_RELEASE_GATE_HOLD"
